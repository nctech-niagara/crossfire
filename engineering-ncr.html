<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar padding">
            <div>
                <div class="logo">
                    <h1>CrossFire</h1>
                </div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">All
                                NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <li><i class="bi bi-pencil"></i><a href="edit-ncr.html">Edit NCR</a></li>
                        <li><i class="bi bi-gear"></i><a href="/">Settings</a></li>
                        <hr />
                        <li><i class="bi bi-star"></i><a href="/">QA
                                Panel</a></li>
                        <li><i class="bi bi-star"></i><a href="/">Engineering Panel</a></li>
                        <li><i class="bi bi-star"></i><a href="/">Operations
                                Panel</a></li>
                    </ul>
                </nav>
            </div>
            <div class="theme-toggle padding">
                <div class="mode">
                    <div>
                        <i class="bi bi-moon"></i>
                        <span id="theme-text"></span>
                    </div>
                    <div>
                        <label class="switch">
                            <input type="checkbox" id="theme-switch">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="padding">
                <div class="flex mobile">
                    <div class="hamburger-menu"><i class="bi bi-list"></i></div>
                    <div class="logo">CrossFire</div>
                </div>
                <div class="grid-end">
                    <div class="flex">
                        <div class="notification-btn"><i class="bi bi-bell"></i></div>
                        <div class="user-info desktop"><span>John Doe</span></div>
                        <div class="avatar-btn"><span>a</span></div>
                    </div>
                </div>
            </header>

            <section id="main-section" class="padding">
                <form id="engineer-ncr-form" class="vertical-spacing grid">
                    <h2>Engineering Stage</h2>

                    <label>Review by CF Engineering: (indicate disposition by "checking" one of the following)</label>
                    <input type="radio" name="ncrEngineer" value="AsIs"> Use As Is
                    <input type="radio" name="ncrEngineer" value="Repair"> Repair
                    <input type="radio" name="ncrEngineer" value="Rework"> Rework
                    <input type="radio" name="ncrEngineer" value="Scrap"> Scrap


                    <div class="form-group-ncr">
                        <label><strong>Does Customer require notification?</strong></label>
                        <input type="radio" name="ncrCustomer" value="Yes"> Yes
                        <input type="radio" name="ncrCustomer" value="No"> No
                    </div>

                    <div id="ncrNote" class="note">
                        (If "Yes" then raise message to customer detailing issues)
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="/script/main.js"></script>
    <script src="/script/edit-ncr.js"></script>



</body>

</html>

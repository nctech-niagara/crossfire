<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar padding">
            <div>
                <div class="logo">
                    <h1>CrossFire</h1>
                </div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <li><i class="bi bi-gear"></i><a href="/">Log out</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="create-ncr.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="/">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
            <div class="theme-toggle padding">
                <div class="mode">
                    <div>
                        <i class="bi bi-moon"></i>
                        <span id="theme-text"></span>
                    </div>
                    <div>
                        <label class="switch">
                            <input type="checkbox" id="theme-switch">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="padding">
                <div class="flex mobile">
                    <div class="hamburger-menu"><i class="bi bi-list"></i></div>
                    <div class="logo">CrossFire</div>
                </div>
                <div class="grid-end">
                    <div class="flex">
                        <div class="notification-btn">
                         <i class="bi bi-bell"></i>
                         <span id="engineer-notif" style="
                        display:none;
                        background:red;
                        color:white;
                        border-radius:50%;
                         padding:2px 6px;
                        font-size:0.7rem;
                        position:absolute;
                        margin-left:-10px;
                        margin-top:-5px;
                        "></span>
                    
                </div>

                        <div class="user-info desktop"><span>John Doe</span></div>
                        <div class="avatar-btn"><span>a</span></div>
                    </div>
                </div>
            </header>

  <section id="main-section" class="padding">

    <h2>Engineering NCRs</h2>

    <table class="table">
        <thead>
            <tr>
                <th>NCR</th>
                <th>Created</th>
                <th>Supplier</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="engineering-ncr-table"></tbody>
    </table>

    <br><br>

    <form id="engineering-ncr-form" class="vertical-spacing grid edit-form">
        <h3>Engineering Stage</h3>

        <label>NCR Number</label>
        <input id="eng-ncr-number" type="text" readonly class="muted-text">

        <label>Created On</label>
        <input id="eng-created-on" type="text" readonly class="muted-text">

        <label>Supplier</label>
        <input id="eng-supplier" type="text" readonly>

        <label>Engineering Disposition</label>
        <div>
            <input type="radio" name="ncrEngineer" value="AsIs"> Use As Is
            <input type="radio" name="ncrEngineer" value="Repair"> Repair
            <input type="radio" name="ncrEngineer" value="Rework"> Rework
            <input type="radio" name="ncrEngineer" value="Scrap"> Scrap
        </div>

        <label>Customer Requires Notification?</label>
        <div>
            <input type="radio" name="ncrCustomer" value="Yes"> Yes
            <input type="radio" name="ncrCustomer" value="No"> No
        </div>

        <button type="submit" class="btn-style">Save</button>
        <button type="button" id="engineering-complete" class="btn-style">Mark Complete</button>
    </form>

</section>

        </main>
    </div>

    <script src="/script/main.js"></script>
    <script src="/script/edit-ncr.js"></script>
    <script src="/script/engineering-ncr.js"></script>




</body>

</html>

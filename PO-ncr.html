<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchasing & Operations NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="/script/main.js"></script>
</head>
<body>
    <div class="container">

        <!-- Quick Access Menu -->
        <aside class="sidebar padding">
            <div>
                <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="create-ncr.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="PO-ncr.html">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <!-- Quick Access Menu END -->

        <!-- Main -->
        <main class="main">
            <header class="padding">
                <div class="flex mobile">
                    <div class="hamburger-menu"><i class="bi bi-list"></i></div>
                    <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                </div>
                <div class="grid-end">
                    <div class="flex">
                        <!--<div class="notification-btn"><i class="bi bi-bell"></i></div>-->
                        <div class="user-info desktop"><span>John Doe</span></div>
                        <div class="avatar-btn"><span>a</span></div>
                    </div>
                </div>
            </header>

            <!--PO NCR page-->

            <section id="main-section" class="padding">
                <form id="PO-ncr-form" class="vertical-spacing grid">
                    <h2>Purchasing & Operations NCR</h2>

                    <div>
                    <label for="PurPre">Purchasing's Preliminary Decision<span class="required">*</span></label>
                    <select id="PurPre" required>
                        <option value="">*Select</option>
                        <option value="Return">Return to Supplier for either "rework" or "replacement"</option>
                        <option value="Rework">Rework "In-House"</option>
                        <option value="ScrapIH">Scrap in House"</option>
                        <option value="Defer">Defer for HBC Engineering Review"</option>
                    </select>
                    </div>

                    <div>
                    <label for="CAR">Was a CAR raised?<span class="required">*</span></label>
                    <select id="CAR" required>
                        <option value="">*Select</option>
                        <option value="yes">Yes"</option>
                        <option value="no">No"</option>
                    </select>

                    <label for="yesCAR">If "Yes" indicate CAR #</label>
                    <textarea id="yesCAR" placeholder="CAR NUMBER"></textarea>
                    </div>

                    <div>
                    <label for="FollowUp">Follow-up Required?<span class="required">*</span></label>
                    <select id="FollowUp" required>
                        <option value="">*Select</option>
                        <option value="yes">Yes"</option>
                        <option value="no">No"</option>
                    </select>

                    <label for="typeExDate">If "Yes" indicate type & expected date</label>
                    <textarea id="typeExDate" placeholder="type & expected date"></textarea>
                    </div>

                    <div>
                    <label for="Re-Inspect">Re-Inspected Acceptable?<span class="required">*</span></label>
                    <select id="Re-Inspect" required>
                        <option value="">*Select</option>
                        <option value="yes">Yes"</option>
                        <option value="no">No"</option>
                    </select>

                    <label for="newNCRnum">(If "No" then record new NCR number)</label>
                    <textarea id="newNCRnum" placeholder="New NCR Number"></textarea>
                    </div>

                    <div>
                    <label for="NCRClosed">NCR Closed<span class="required">*</span></label>
                    <select id="NCRClosed" required>
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                    </div>

                    <div>
                    <label for="opName">Operations Manager's Name<span class="required">*</span></label>
                    <input type="text" id="opName" placeholder="*John Doe" required>

                    <label for="inName">Inspector's Name<span class="required">*</span></label>
                    <input type="text" id="inName" placeholder="*John Doe" required>

                    <label for="qdName">Quality Department Manager's Name<span class="required">*</span></label>
                    <input type="text" id="qdName" placeholder="*John Doe" required>

                    <label for="addinfo3">Additional information</label>
                    <textarea id="addinfo3" placeholder="*Additional information Here"></textarea>
                    </div>

                    <div>
                    <button type="button" id="btnSave" class="btn-style">Save</button>
                    <button type="submit" class="btn-style" id="submitbtn">Validate and submit</button>
                    </div>

                </form>
            </section>
        </main>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossfire Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="/script/main.js"></script>
  </head>

  <body>
    <div class="container">

        <!-- Quick Access Menu -->
        <aside class="sidebar padding">
            <div>
                <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="create-ncr.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="PO-ncr.html">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <!-- Quick Access Menu END -->

      <!-- Main -->
      <main class="main">
        <header class="padding">
          <div class="flex mobile">
            <div class="hamburger-menu"><i class="bi bi-list"></i></div>
            <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
          </div>
          <div class="grid-end">
            <div class="flex">
              <!--<div class="notification-btn"><i class="bi bi-bell"></i></div>-->
              <div class="user-info desktop"><span>John Doe</span></div>
              <div class="avatar-btn"><span>a</span></div>
            </div>
          </div>
        </header>

        <section id="main-section" class="padding">
          <div class="vertical-spacing grid">
            <!-- Summary cards -->
            <section>
              <h2>NCR Summary</h2>
              <div class="summary-cards grid">
                <div class="card grid">
                  <h3 class="num">10</h3>
                  <p class="title">Active NCR</p>
                </div>
                <div class="card grid">
                  <h3 class="num">22</h3>
                  <p class="title">Closed NCR</p>
                </div>
                <div class="card grid">
                  <h3 class="num">32</h3>
                  <p class="title">Total NCR</p>
                </div>
              </div>
            </section>

            <!-- Table -->
            <section class="table-container">
              <h2>Recent NCRs</h2>
              <table>
                <thead>
                  <tr>
                    <th>NCR Number</th>
                    <th>Created On</th>
                    <th>Supplier</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="ncr-logs-table-home">
                </tbody>
              </table>
            </section>

            <!-- Recent Activities  -->
            <section class="card recent-activity">
              <h3>Recent Activity</h3>
              
            </section>

          </div>
        </section>
      </main>
    </div>
  </body>

</html>

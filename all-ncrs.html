<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View NCRs - CrossFire</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <script src="https://code.jquery.com/jquery-3.7.1.js"
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
            crossorigin="anonymous"></script>
        <script src="/script/main.js"></script>
    </head>
    <body>
        <div class="container">

        <!-- Quick Access Menu -->
        <aside class="sidebar padding">
            <div>
                <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="create-ncr.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="PO-ncr.html">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <!-- Quick Access Menu END -->

            <!-- Main -->
            <main class="main">
                <header class="padding">
                    <div class="flex mobile">
                        <div class="hamburger-menu"><i
                                class="bi bi-list"></i></div>
                        <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                    </div>
                    <div class="grid-end">
                        <div class="flex">
                            <!--<div class="notification-btn"><i class="bi bi-bell"></i></div>-->
                            <div class="user-info desktop"><span>John
                                    Doe</span></div>
                            <div class="avatar-btn"><span>a</span></div>
                        </div>
                    </div>
                </header>

                <section id="main-section" class="padding">
                    <div class="vertical-spacing grid">

                        <!-- Filters -->
                        <h2>All NCRs</h2>
                        <section class="grid filter">
                            <div>
                                <label for="search-logs">Search Logs by Supplier</label>
                                <input type="search" id="search-logs"
                                    list="search-supplier"
                                    name="txtSupplier"
                                    placeholder="Search Logs">

                                <datalist id="search-supplier">
                                    <option value="Niagara College"></option>
                                    <option value="Ontario Steelworks"></option>
                                    <option value="Hamilton Parts Co."></option>
                                    <option
                                        value="Maple Plastics Ltd."></option>
                                    <option
                                        value="GreenTech Supplies"></option>
                                </datalist>
                            </div>
                            <div class="grid filter-options">
                                <!-- Status filter  -->
                                <div>
                                    <label for="status">Status</label>
                                    <select name="status" id="status">
                                        <option value="all">All</option>
                                        <option value="active">Active</option>
                                        <option value="closed">Closed</option>
                                    </select>
                                </div>
                                <!-- Date Filter  -->
                                <div class="grid filter-date">
                                    <div>
                                        <label for="fromDate">From</label>
                                        <input type="date" id="fromDate" name="fromDate">
                                    </div>
                                    <div>
                                        <label for="toDate">To</label>
                                        <input type="date" id="toDate" name="toDate">
                                    </div>
                                </div>

                            </div>
                        </section>

                        <!-- Table -->
                        <section class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>NCR Number</th>
                                        <th>Created On</th>
                                        <th>Supplier</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="ncr-logs-table">
                                </tbody>
                            </table>
                        </section>

                    </div>
                </section>
            </main>
        </div>

    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Rep - Create NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src= "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/script/main.js"></script>
</head>
<body>
    <div class="container">

        <!-- Quick Access Menu -->
        <aside class="sidebar padding">
            <div>
                <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="create-ncr.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="PO-ncr.html">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
        </aside>
        <!-- Quick Access Menu END -->

        <!-- Main -->
        <main class="main">
            <header class="padding">
                <div class="flex mobile">
                    <div class="hamburger-menu"><i class="bi bi-list"></i></div>
                    <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                </div>
                <div class="grid-end">
                    <div class="flex">
                        <!--<div class="notification-btn"><i class="bi bi-bell"></i></div>-->
                        <div class="user-info desktop"><span>John Doe</span></div>
                        <div class="avatar-btn"><span>a</span></div>
                    </div>
                </div>
            </header>

            <!--Quality Rep NCR page-->

            <section id="main-section" class="padding">
                <form id="create-ncr-form" class="vertical-spacing grid">
                    <h2>Quality Rep - Create NCR</h2>
                    
                    <div>
                    <label for="created-on" class="required">Created On date</label>
                    <lable for="created-on" class="mini-text">*Date is always Today's Date</lable>
                    <input type="date" id="created-on" class="muted-text" readonly>

                    <label for="ncr-number" class="required">NCR Number</label>
                    <lable for="ncr-number" class="mini-text">*NCR Number is auto generated</lable>
                    <input type="text" id="ncr-number" class="muted-text" readonly>

                    <label for="prod-number">PO or Prod. Number (Numbers only)<span class="required">*</span></label>
                    <input type="number" id="prod-number" placeholder="*0000" required>

                    <label for="sales-number">Sales Order Number (Numbers only)<span class="required">*</span></label>
                    <input type="number" id="sales-number" placeholder="*0000" required>

                    <label for="quantity-num">Quantity receved (Numbers only)<span class="required">*</span></label>
                    <input type="number" id="quantity-num" placeholder="*00" required>
                    
                    <label for="quantity-num-defect">Quantity defective (Numbers only)<span class="required">*</span></label>
                    <input type="number" id="quantity-num-defect" placeholder="*00" required>
                    </div>

                    <div>
                    <label for="Process">Identify Process Applicable:<span class="required">*</span></label>
                    <select id="Process" required>
                        <option value="">*Select Process</option>
                        <option value="SupRec">Supplier or Rec-Insp</option>
                        <option value="WIP">WIP (Production Order)</option>
                    </select>
                    
                    
                    <label for="supplierName">Supplier Name<span class="required">*</span></label>
                    <!--
                    <select id="supplierName" required>
                        <option value="">*Select Supplier</option>
                        ADD CONECTION TO SUPPLIERS.JSON
                    </select>
                    -->
                    <input type="text" id="supplierName" placeholder="*Example Supply Co." required>

                    <label for="desc-item">Description of Item (including SAP Number)<span class="required">*</span></label>
                    <textarea id="desc-item" placeholder="*Description of Item here" required></textarea>

                    <label for="desc-defect">Description of Defect<span class="required">*</span></label>
                    <textarea id="desc-defect" placeholder="*Description of Defect in as much detail as possible" required></textarea>

                    <label for="itemMark">Item marked Nonconforming<span class="required">*</span></label>
                    <select id="itemMark" required>
                        <option value="">*Select status</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                    </div>

                    <div>
                    <label for="quality-rep-name">Quality Representative's Name<span class="required">*</span></label>
                    <input type="text" id="quality-rep-name" placeholder="*John Doe" required>

                    <label for="addinfo">Additional information</label>
                    <textarea id="addinfo" placeholder="*Additional information Here"></textarea>
                    </div>

                    <div>
                    <button type="button" id="btnSave" class="btn-style">Save</button>
                    <button type="submit" class="btn-style" id="submitbtn">Validate and submit</button>
                    </div>

                </form>
            </section>
        </main>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar padding">
            <div>
                <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <li><i class="bi bi-gear"></i><a href="/">Log out</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="create-ncr.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="/">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
            <div class="theme-toggle padding">
                <div class="mode">
                    <div>
                        <i class="bi bi-moon"></i>
                        <span id="theme-text"></span>
                    </div>
                    <div>
                        <label class="switch">
                            <input type="checkbox" id="theme-switch">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="padding">
                <div class="flex mobile">
                    <div class="hamburger-menu"><i class="bi bi-list"></i></div>
                    <div class="logo"><img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206"></div>
                </div>
                <div class="grid-end">
                    <div class="flex">
                        <div class="notification-btn"><i class="bi bi-bell"></i></div>
                        <div class="user-info desktop"><span>John Doe</span></div>
                        <div class="avatar-btn"><span>a</span></div>
                    </div>
                </div>
            </header>

            <!--Quality Rep NCR page-->

            <section id="main-section" class="padding">
                <form id="create-ncr-form" class="vertical-spacing grid">
                    <h2>Create NCR</h2>

                    <!--ADD CHECKBOXES. REFERENCE ORIGINAL NCR PAGE.-->
                    
                    <div>
                    <label for="ncr-number">NCR Number</label>
                    <lable for="ncr-number" class="mini-text">*NCR Number is auto generated</lable>
                    <input type="text" id="ncr-number" value="2025-001" class="muted-text" disabled>

                    <label for="prod-number">PO or Prod. Number<span class="required">*</span></label>
                    <input type="number" id="prod-number" placeholder="*0000" required>

                    <label for="sales-number">Sales Order Number<span class="required">*</span></label>
                    <input type="number" id="sales-number" placeholder="*0000" required>

                    <label for="quantity-num">Quantity receved<span class="required">*</span></label>
                    <input type="number" id="quantity-num" placeholder="*00" required>
                    
                    <label for="quantity-num-defect">Quantity defective<span class="required">*</span></label>
                    <input type="number" id="quantity-num-defect" placeholder="*00" required>
                    </div>

                    <div>
                    <!--ADD CHECKBOXES. REFERENCE ORIGINAL NCR PAGE.-->

                    <label for="supplier">Supplier Name<span class="required">*</span></label>
                    <input type="text" id="supplier" placeholder="*Example Supply Co." required>

                    <label for="desc-item">Description of Item (including SAP Number)<span class="required">*</span></label>
                    <textarea id="desc-item" placeholder="*Description of Item here" required></textarea>

                    <label for="desc-defect">Description of Defect<span class="required">*</span></label>
                    <textarea id="desc-defect" placeholder="*Description of Defect in as much detail as possible" required></textarea>

                    <!--ADD CHECKBOXES. REFERENCE ORIGINAL NCR PAGE.-->
                    </div>

                    <div>
                    <label for="quality-rep-name">Quality Representative's Name<span class="required">*</span></label>
                    <input type="text" id="quality-rep-name" placeholder="*John Doe" required>

                    <label for="remarks">Additional Comments (optional)</label>
                    <textarea id="remarks" placeholder="*Additional Comments Here"></textarea>

                    <label for="created-on">Created On<span class="required">*</span></label>
                    <input type="date" id="created-on" required>
                    </div>

                    <label for="status">Status<span class="required">*</span></label>
                    <select id="status" required>
                        <option value="">*Select status</option>
                        <option value="Active">Active</option>
                        <option value="Closed">Closed</option>
                        <option value="Pending">Pending</option>
                    </select>

                    <button type="submit" class="btn-style" id="submitbtn">Save NCR</button>
                </form>
            </section>
        </main>
    </div>

    <script src="/script/main.js"></script>
    <script src="/script/create-ncr.js"></script>
</body>
</html>

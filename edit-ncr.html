<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar padding">
            <div>
                <div class="logo">
                    <a href="home.html">
                      <img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206">
                    </a>
                  </div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <li><i class="bi bi-gear"></i><a href="/">Log out</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="qualityrep.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="purchasing.html">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>

            <div class="theme-toggle padding">
                <div class="mode">
                    <div>
                        <i class="bi bi-moon"></i>
                        <span id="theme-text"></span>
                    </div>
                    <div>
                        <label class="switch">
                            <input type="checkbox" id="theme-switch">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <header class="padding">
                <div class="flex mobile">
                    <div class="hamburger-menu"><i class="bi bi-list"></i></div>
                    <div class="logo">CrossFire</div>
                </div>
                <div class="grid-end">
                    <div class="flex">
                        <div class="notification-btn"><i class="bi bi-bell"></i></div>
                        <div class="user-info desktop"><span>John Doe</span></div>
                        <div class="avatar-btn"><span>a</span></div>
                    </div>
                </div>
            </header>

            <section id="main-section" class="padding">
                <form id="edit-ncr-form" class="vertical-spacing grid edit-form">

                    <h2>Edit NCR</h2>

                    <label>NCR Number</label>
                    <input id="edit-ncr-number" type="text" readonly class="muted-text">

                    <label>Created On</label>
                    <input id="edit-created-on" type="date" readonly class="muted-text">

                    <label>Supplier</label>
                    <input id="edit-supplier" type="text" readonly>

                    <label>Status</label>
                    <select id="edit-status">
                        <option value="Active">Active</option>
                        <option value="Closed">Closed</option>
                        <option value="Pending Purchasing">Pending Purchasing</option>
                    </select>

                    <button type="submit" class="btn-style">Save Changes</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="/script/main.js"></script>
    <script src="/script/edit-ncr.js"></script>

</body>
</html>

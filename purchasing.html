<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit NCR - CrossFire</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar padding">
            <div>
                <div class="logo">
                    <a href="home.html">
                      <img src="assets/Crossfire Logo-transparent.png" alt="Crossfire" width="206">
                    </a>
                </div>
                <hr />
                <nav>
                    <ul>
                        <li><i class="bi bi-grid"></i><a href="home.html">Dashboard</a></li>
                        <li><i class="bi bi-bar-chart"></i><a href="all-ncrs.html" class="active">View NCRs</a></li>
                        <li><i class="bi bi-pencil"></i><a href="create-ncr.html">Create NCR</a></li>
                        <li><i class="bi bi-gear"></i><a href="/">Log out</a></li>
                        <hr/>
                        <li><i class="bi bi-star"></i><a href="qualityrep.html">Quality Rep Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="engineering-ncr.html">Engineering Portion</a></li>
                        <li><i class="bi bi-star"></i><a href="purchasing.html">Purchasing/Operations Portion</a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main padding">
            <h2>Purchasing Preliminary Decision</h2>

            <form>
        
                <div class="section">
                    <div class="vertical-spacing">
                        <label><input type="radio" name="purchasing" value="return_supplier" class="purchasingRad"> Return to Supplier</label>
                        <label><input type="radio" name="purchasing" value="rework_inhouse" class="purchasingRad"> Rework (In-House)</label>
                        <label><input type="radio" name="purchasing" value="scrap" class="purchasingRad"> Scrap In-House</label>
                        <label><input type="radio" name="purchasing" value="defer_hbc" class="purchasingRad"> Defer for HBC Engineering Review</label>
                    </div>
        
                    <div id="return-options" class="vertical-spacing" style="margin-left:20px; display:none;">
                        <label>Return to Supplier for:</label>
                        <label><input type="radio" name="return" value="rework"> Rework</label>
                        <label><input type="radio" name="return" value="replacement"> Replacement</label>
                    </div>
                </div>
        
                <!-- CAR Section -->
                <div class="section">
                    <h3>Corrective Action Report (CAR)</h3>
                    <div class="vertical-spacing">
                        <label><input type="radio" name="car_raised" value="yes" class="carRad"> Yes</label>
                        <label><input type="radio" name="car_raised" value="no" class="carRad"> No</label>
                    </div>
                    <div id="car-number-container" style="display:none;">
                        <label>If Yes, indicate CAR #</label>
                        <input type="text" id="car-number" name="car-number">
                    </div>
                </div>
        
                <!-- Follow-Up Section -->
                <div class="section">
                    <h3>Follow-up Required?</h3>
                    <div class="vertical-spacing">
                        <label><input type="radio" name="followUp" value="yes" class="followRad"> Yes</label>
                        <label><input type="radio" name="followUp" value="no" class="followRad"> No</label>
                    </div>
                    <div id="follow-up-details" style="display:none;">
                        <label>Type</label>
                        <input type="text" id="followUptype" name="followUptype">
                        <label>Expected Date</label>
                        <input type="date" id="followUpDate" name="followUpDate">
                    </div>
                </div>
        
                <button type="submit">Save</button>
        
            </form>
        </main>
    </div>
        

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="/script/main.js"></script>
    <script src="/script/edit-ncr.js"></script>

</body>
</html>
